[project]
name = "transparencia-pipeline"
version = "0.10"
description = "Pipeline de dados end-to-end Portal da Transparência"
authors = [
    {name = "Victor Araujo",email = "vl6472447@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "google-cloud-storage (>=3.9.0,<4.0.0)",
    "google-cloud-bigquery (>=3.40.1,<4.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
